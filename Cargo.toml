[package]
name = "badgehub"
version = "0.1.0"
edition = "2024"
description = "Scaffold and manage BadgeHub apps for event badges"
homepage = "https://badgehub.eu"
repository = "https://github.com/paulinevos/badgehub-scaffolder"
readme = "README.md"
license = "MIT"
keywords = ["badgehub", "badge", "scaffold", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "badgehub"
path = "src/lib.rs"

[[bin]]
name = "bh"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
inquire = "0.9.4"
png = "0.18"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order keeps the keys of an edited metadata.json where the user left
# them; without it every `bh set` would silently sort the whole file.
serde_json = { version = "1.0.151", features = ["preserve_order"] }
ureq = "3.4.0"

[dev-dependencies]
assert_cmd = "2.2.2"
mockito = "1.7.2"
predicates = "3.1.3"
tempfile = "3.27.0"
